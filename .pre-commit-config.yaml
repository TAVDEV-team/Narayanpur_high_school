repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
    
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
        stages: [pre-commit]
        pass_filenames: true
        additional_dependencies: []

        

  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8

